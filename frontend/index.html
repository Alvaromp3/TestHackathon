<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tiger Hacks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #1c1410;
      --ember: #c2410c;
      --flame: #ea580c;
      --sand: #f3e6d8;
      --white: #fffaf5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: "Figtree", sans-serif;
      color: var(--ink);
      background: var(--sand);
      overflow: hidden;
    }

    .scene {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: clamp(1.5rem, 5vw, 3.5rem);
      background:
        radial-gradient(ellipse 90% 70% at 12% 18%, rgba(234, 88, 12, 0.3), transparent 55%),
        radial-gradient(ellipse 70% 55% at 92% 82%, rgba(194, 65, 12, 0.16), transparent 50%),
        linear-gradient(160deg, #f7ebe0 0%, #edd9c4 45%, #e8c9a8 100%);
      overflow: hidden;
    }

    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.45'/%3E%3C/svg%3E");
      opacity: 0.06;
      pointer-events: none;
      mix-blend-mode: multiply;
    }

    .glow {
      position: absolute;
      width: min(72vw, 540px);
      height: min(72vw, 540px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(234, 88, 12, 0.38), transparent 70%);
      filter: blur(48px);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .glow--a { top: -12%; left: -10%; }
    .glow--b {
      bottom: -18%;
      right: -12%;
      animation-delay: -5s;
      background: radial-gradient(circle, rgba(28, 20, 16, 0.1), transparent 70%);
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: min(92vw, 920px);
    }

    .brand {
      font-family: "Big Shoulders Display", sans-serif;
      font-weight: 800;
      font-size: clamp(4.5rem, 18vw, 9.5rem);
      line-height: 0.88;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--ink);
      animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .brand .accent {
      color: var(--flame);
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(28, 20, 16, 0.62);
      animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    .cta {
      margin-top: 2.25rem;
      display: inline-flex;
      align-items: center;
      padding: 0.9rem 1.75rem;
      border: none;
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.25s ease, background 0.25s ease;
      animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.24s both;
    }

    .cta:hover {
      background: var(--ember);
      transform: translateY(-2px);
    }

    .cta:focus-visible {
      outline: 2px solid var(--flame);
      outline-offset: 3px;
    }

    .stripe {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--ink), var(--ember), var(--flame), #fdba74);
      transform-origin: left;
      animation: stretch 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes stretch {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(20px, 16px) scale(1.06); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="glow glow--a" aria-hidden="true"></div>
    <div class="glow glow--b" aria-hidden="true"></div>

    <div class="content">
      <h1 class="brand">Tiger <span class="accent">Hacks 1.0</span></h1>
      <p class="tagline">Build. Break. Ship.</p>
      <a class="cta" href="#">Coming soon</a>
    </div>

    <div class="stripe" aria-hidden="true"></div>
  </main>
</body>
</html>
